[package]
name = "nicolaw"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5"
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }
dirs = "7.0.0"
gpui-kit = "0.7"
handy-recorder = "0.1"
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
hound = "3.5"
mime_guess = "2.0.5"
quick-xml = "0.41"
rusqlite = { version = "0.40.2", features = ["blob", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
transcribe-cpp = "0.4"
zip = { version = "5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-foundation = "0.3.2"
objc2-pdf-kit = { version = "0.3.2", features = ["objc2-app-kit"] }
objc2-vision = { version = "0.3.2", features = ["objc2-core-foundation"] }

[profile.dev.package]
candle-core = { opt-level = 3 }
candle-nn = { opt-level = 3 }
candle-transformers = { opt-level = 3 }
candle-metal-kernels = { opt-level = 3 }
gemm = { opt-level = 3 }
tokenizers = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
